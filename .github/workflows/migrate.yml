name: Migrate database

# Runs the Drizzle migrations against the development database on every push
# to main.
#
# This deploys alongside Vercel rather than before it, so which finishes first
# is not guaranteed. Every migration must therefore be backwards compatible
# with the currently deployed code: add columns and tables first, remove them
# in a later release. See docs/plans/phase-1a.md.
on:
  push:
    branches: [main]

# One migration at a time. Two concurrent runs would race for the same
# advisory lock and one would fail.
concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
