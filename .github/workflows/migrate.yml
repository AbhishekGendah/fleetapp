name: Migrate and deploy

# After CI passes for a commit on main, in this order and from exactly that
# commit (review G1-3):
#   1. the database updates run (`pnpm db:migrate`: stops, changing
#      nothing, if an update that ran was edited or one is out of order);
#   2. only then are both apps put live with Vercel's command-line tool.
# If the update fails, nothing goes live and the old code keeps working.
#
# The old code is still live while the update runs, so every update must
# work with it: add columns and tables first, remove them in a later release
# (expand, deploy, then contract); add CHECKs on large tables as NOT VALID,
# then VALIDATE. See docs/plans/phase-1a.md.
#
# Waiting updates run in one transaction, all or nothing: an update that
# adds an enum value must be pushed on its own, or the next one must compare
# it as text (::text), since a new enum value can't be used before it is
# committed.
#
# Deploying from here starts once the Vercel token is in GitHub's secrets
# and the project IDs in its variables (docs/runbooks/production-database.md);
# until then Vercel deploys from the push itself, as before.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One run at a time. Runs start in the order CI finishes, not the order
# commits landed, so each run first checks its commit is still the newest on
# main and otherwise does nothing: the newer commit's own run updates and
# deploys. An older commit can never be put live over a newer one.
# (The update command also holds a database lock of its own.)
concurrency:
  group: migrate-and-deploy
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      is_newest: ${{ steps.newest.outputs.is_newest }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Still the newest commit on main?
        id: newest
        env:
          THIS_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          newest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$newest" = "$THIS_COMMIT" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is on main: its own run updates the database and deploys."
          fi

      - uses: pnpm/action-setup@v4.4.0
        if: steps.newest.outputs.is_newest == 'true'

      - uses: actions/setup-node@v4.4.0
        if: steps.newest.outputs.is_newest == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        if: steps.newest.outputs.is_newest == 'true'

      - run: pnpm db:migrate
        if: steps.newest.outputs.is_newest == 'true'
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

  deploy:
    needs: migrate
    if: vars.VERCEL_ORG_ID != '' && needs.migrate.outputs.is_newest == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            project: VERCEL_WEB_PROJECT_ID
          - app: admin
            project: VERCEL_ADMIN_PROJECT_ID
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[matrix.project] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pinned: released 20 Oct 2026, Apache-2.0. Used here only, never by the apps.
      VERCEL_CLI: vercel@65.0.0
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"

      # Exactly this commit's files are sent to Vercel, which builds and puts
      # them live with the project's own settings (its Root Directory) and
      # secrets. Built here instead, the secrets can't be read: Vercel never
      # hands secret values out (5 Nov 2026). Run from the repository root, as
      # Vercel asks for a monorepo.
      - run: pnpm dlx "$VERCEL_CLI" deploy --prod --yes --token="$VERCEL_TOKEN"
