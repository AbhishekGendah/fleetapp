name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reads the code only; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      # Fails on any copy-pasted block of code: shared code lives in one place.
      - run: pnpm duplicates

      - run: pnpm typecheck

      - run: pnpm test

      # Builds both apps as Vercel does (VERCEL_ENV=production, the dev site's
      # label too), so a build that would fail to deploy fails here first.
      # Placeholder settings only: no real secrets, nothing is contacted.
      - run: pnpm build
        env:
          VERCEL_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          APP_URL: http://localhost:3100
          ADMIN_URL: http://localhost:3101
          DATABASE_URL: postgres://placeholder:placeholder@localhost/placeholder
          AUTH_DATABASE_URL: postgres://placeholder:placeholder@localhost/placeholder
          BETTER_AUTH_SECRET: placeholder-placeholder-placeholder-32
          AUTH_ISSUER_NAME: CI
          EMAIL_TRANSPORT: dev_outbox
          APP_STAGE: development
          EMAIL_FROM: ci@example.test
          GOOGLE_PLACES_API_KEY: placeholder
          GOOGLE_PLACES_API_URL: http://localhost:3999
          STORAGE_BUCKET: placeholder-files
          IDENTITY_STORAGE_BUCKET: placeholder-identity
          FILE_STORAGE_REGION: ap-southeast-2
          FILE_STORAGE_ACCESS_KEY_ID: placeholder
          FILE_STORAGE_SECRET_ACCESS_KEY: placeholder
          CRON_SECRET: placeholder-placeholder-placeholder-32
          OPS_ALERT_EMAIL: ops@example.test

  # "Update a filled database" (review G1-2): the database updates in this
  # change, run on a database as main has it now, filled with main's demo
  # data, the way the real databases already hold data. An update that only
  # works on an empty database (say, a new required column with no default)
  # fails here, not on the dev site. Skipped when no update changed.
  update-filled-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Find the code this change starts from
        id: base
        env:
          PUSHED_FROM: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PULL_REQUEST_BASE:-$PUSHED_FROM}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A new branch or a forced push: the starting commit is unknown or
            # gone, so compare with the commit before this one rather than skip.
            base="$(git rev-parse HEAD~1)"
            echo "The starting commit isn't known; checking against $base."
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- packages/db/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database update changed: nothing to check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4.4.0
        if: steps.base.outputs.changed == 'true'

      - uses: actions/setup-node@v4.4.0
        if: steps.base.outputs.changed == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Start a throwaway Postgres
        if: steps.base.outputs.changed == 'true'
        run: |
          docker run -d --name filled-db -e POSTGRES_PASSWORD=throwaway -p 55432:5432 postgres:17-alpine
          for attempt in $(seq 1 30); do docker exec filled-db pg_isready -U postgres && break; sleep 2; done

      - name: Build and fill it as main has it
        if: steps.base.outputs.changed == 'true'
        env:
          TEST_POSTGRES_SUPERUSER_URL: postgres://postgres:throwaway@localhost:55432/postgres
        run: |
          git worktree add ../base "${{ steps.base.outputs.sha }}"
          cd ../base
          pnpm install --frozen-lockfile
          pnpm --filter web exec vitest run test/demo-data.test.ts

      - name: Run this change's updates on it
        if: steps.base.outputs.changed == 'true'
        env:
          TEST_POSTGRES_SUPERUSER_URL: postgres://postgres:throwaway@localhost:55432/postgres
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fleetapp/db db:update-filled-database

      - if: always()
        run: docker rm -f filled-db || true

  # Each app used in a real browser: keyboard, screen-reader names and phone
  # width. Runs against a throwaway Postgres (and, for the Operator app, a
  # local S3 and a Google Places stand-in) in Docker, with made-up data only.
  browser-tests:
    # Pinned: Playwright 1.56 does not support Ubuntu 26.04 (ubuntu-latest).
    # Move on when Playwright is next upgraded.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [admin, web]
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ${{ matrix.app }} exec playwright install --with-deps chromium

      - run: pnpm --filter ${{ matrix.app }} e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: browser-test-traces-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7
